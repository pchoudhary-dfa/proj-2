apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-dm-ingress
  namespace: apps-dfa-v6-test
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - test.datamanager.dfa6.dataforall.org
    secretName: test-dm-test-tls
  rules:
  - host: test.datamanager.dfa6.dataforall.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-dm-service
            port:
              number: 3000
