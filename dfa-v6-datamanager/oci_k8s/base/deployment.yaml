apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfav6-dm
  namespace: apps-dfa-v6-demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dfav6-dm
  template:
    metadata:
      labels:
        app: dfav6-dm
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: dfav6-dm
        image: dfav6-dm
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: TZ
          value: "Asia/Kolkata"
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "768Mi"
            cpu: "250m"
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
