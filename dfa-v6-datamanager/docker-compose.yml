version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base  # Use base stage for development
    ports:
      - "3001:3000"
    volumes:
      # Mount source code for hot-reload
      - .:/app
      # Exclude node_modules from host, use container's node_modules
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      # Override these if your API is running on a different host/port
      # For Docker, use host.docker.internal on Mac/Windows or the service name if in same network
      # These NEXT_PUBLIC_ variables are read at dev server startup
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://test.api.dfa6.dataforall.org}
      - NEXT_PUBLIC_APP_KEYWORD=${NEXT_PUBLIC_APP_KEYWORD:-DTK_VIZ}
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Install dependencies if needed, then start dev server
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
