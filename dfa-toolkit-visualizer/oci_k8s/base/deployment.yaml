apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfav6-web
  namespace: apps-dfa-v6-demo
  annotations:
    kubernetes.io/change-cause: "initial"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dfav6-web
  template:
    metadata:
      labels:
        app: dfav6-web
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: dfav6-web
        image: dfav6-web
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: TZ
          value: "Asia/Kolkata"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          failureThreshold: 40
          periodSeconds: 5
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
