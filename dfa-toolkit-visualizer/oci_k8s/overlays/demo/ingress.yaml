apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dfav6-web-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - demo.visualizer.dfa6.dataforall.org
    secretName: dfav6-web-tls
  rules:
  - host: demo.visualizer.dfa6.dataforall.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dfav6-web-service
            port:
              number: 3000
