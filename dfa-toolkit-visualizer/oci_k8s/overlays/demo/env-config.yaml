apiVersion: v1
kind: ConfigMap
metadata:
  name: dfav6-env
data:
  APP_BASE_ID: "DTK_VIZ"
  NEXT_PUBLIC_APP_BASE_ID: "DTK_VIZ"
  APP_ID: "DFADEMOVIZ"
  NEXT_PUBLIC_APP_ID: "DFADEMOVIZ"
  NEXT_PUBLIC_BASE_URL: "https://demo.visualizer.dfa6.dataforall.org"
  NEXT_PUBLIC_API_BASE_URL: "https://demo.api.dfa6.dataforall.org"
  NEXT_PUBLIC_ENABLE_API_PROXY: "false"
  NEXT_PUBLIC_API_PROXY_URL: "https://demo.api.dfa6.dataforall.org"
  NEXT_PUBLIC_API_KEY: "dfa_viz_fed_app"
  NEXT_PUBLIC_API_SIGNATURE: "1234567890"
  NODE_ENV: "production"
# Secrets are NOT committed. Manage the "demo-dfav6-secrets" Secret out-of-band, e.g.:
#   kubectl -n <namespace> create secret generic demo-dfav6-secrets \
#     --from-literal=NEXTAUTH_SECRET=<value>
# NEXT_PUBLIC_API_SIGNING_PRIVATE_KEY is a build-time arg supplied by the build pipeline (see build_spec.yaml).
