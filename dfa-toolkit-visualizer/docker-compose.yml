version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base  # Use base stage for development
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot-reload
      - .:/app
      # Exclude node_modules from host, use container's node_modules
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      # Override these if your API is running on a different host/port
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://prd-dfa-toolkit-api-service}
      - NEXT_PUBLIC_ENABLE_API_PROXY=${NEXT_PUBLIC_ENABLE_API_PROXY:-true}
      - API_SIGNING_PRIVATE_KEY=${API_SIGNING_PRIVATE_KEY:-}
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Install dependencies if needed, then start dev server
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
