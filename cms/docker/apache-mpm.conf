# Apache MPM Prefork Configuration
# This configuration increases worker limits to handle concurrent requests
# and prevent connection resets during heavy operations

<IfModule mpm_prefork_module>
    # Maximum number of server processes
    ServerLimit 256
    
    # Maximum number of idle server processes
    StartServers 16
    
    # Minimum number of idle server processes
    MinSpareServers 8
    
    # Maximum number of idle server processes
    MaxSpareServers 32
    
    # Maximum number of simultaneous requests that will be served
    MaxRequestWorkers 256
    
    # Maximum number of requests per child process before it dies
    MaxConnectionsPerChild 10000
</IfModule>

