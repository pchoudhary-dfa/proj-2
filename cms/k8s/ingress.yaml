apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guinea-cms-ingress
  namespace: apps-guinea
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - guinea.dataforall.org
      secretName: guinea-tls
  rules:
    - host: guinea.dataforall.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guinea-cms-portal-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guinea-datamanager-ingress
  namespace: apps-guinea
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - guinea.dataforall.org
      secretName: guinea-tls
  rules:
    - host: guinea.dataforall.org
      http:
        paths:
          - path: /datamanager(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: guinea-data-manager-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guinea-dashboard-ingress
  namespace: apps-guinea
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - guinea.dataforall.org
      secretName: guinea-tls
  rules:
    - host: guinea.dataforall.org
      http:
        paths:
          - path: /dashboard(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: guinea-dfa-dashboard-service
                port:
                  number: 80
