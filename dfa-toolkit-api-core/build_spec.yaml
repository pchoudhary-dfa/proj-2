version: 0.1
component: build
timeoutInSeconds: 6000
runAs: root
shell: bash

env:
  variables:
    TZ: "Asia/Kolkata"
    DEPLOY_ADAPTATIONS: "demo,datanett,guinea,sisomali"  # Comma-separated list or "all"
  exportedVariables:
    - IMAGE_TAG
    - REPOSITORY_URI
    - COMMIT_HASH

steps:
  - type: Command
    name: "Build and push container image"
    timeoutInSeconds: 1800
    command: |
      set -e
      export TZ=Asia/Kolkata
      echo "Current time: $(date)"
      
      export COMMIT_HASH=$(echo ${OCI_TRIGGER_COMMIT_HASH:-$(git rev-parse HEAD)} | cut -c 1-7)
      export IMAGE_TAG="${COMMIT_HASH}"
      export REGION_KEY="me-dubai-1"
      export TENANCY_NAMESPACE="axrfhwznxtja"
      export DEVOPS_PROJECT="dtk-devops"
      export APP_NAME="api-adap"
      export REPOSITORY_URI="${REGION_KEY}.ocir.io/${TENANCY_NAMESPACE}/${DEVOPS_PROJECT}/${APP_NAME}"
      
      echo "IMAGE_TAG=${IMAGE_TAG}" >> ${OCI_PRIMARY_SOURCE_DIR}/build_spec_output.txt
      echo "REPOSITORY_URI=${REPOSITORY_URI}" >> ${OCI_PRIMARY_SOURCE_DIR}/build_spec_output.txt
      echo "COMMIT_HASH=${COMMIT_HASH}" >> ${OCI_PRIMARY_SOURCE_DIR}/build_spec_output.txt
      
      echo "Logging into container registry..."
      echo "${AUTH_TOKEN}" | docker login ${REGION_KEY}.ocir.io -u "${DOCKER_USERNAME}" --password-stdin
      
      echo "Building Docker image..."
      docker build -t "${APP_NAME}:${IMAGE_TAG}" -f Dockerfile .
      docker tag "${APP_NAME}:${IMAGE_TAG}" "${REPOSITORY_URI}:${IMAGE_TAG}"
      
      echo "Pushing image..."
      docker push "${REPOSITORY_URI}:${IMAGE_TAG}"
      
      echo "Installing kubectl..."
      curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      chmod +x kubectl
      mv kubectl /usr/local/bin/
      
      # Parse adaptations
      if [ "${DEPLOY_ADAPTATIONS}" = "all" ]; then
        ADAPTATIONS=($(ls -d oci_k8s/overlays/*/ | xargs -n 1 basename))
      else
        IFS=',' read -ra ADAPTATIONS <<< "${DEPLOY_ADAPTATIONS}"
      fi
      
      echo "Generating manifests for adaptations: ${ADAPTATIONS[@]}"
      
      for ADAPTATION in "${ADAPTATIONS[@]}"; do
        ADAPTATION=$(echo $ADAPTATION | xargs)  # trim whitespace
        echo "Processing: ${ADAPTATION}"
        
        if [ ! -d "oci_k8s/overlays/${ADAPTATION}" ]; then
          echo "ERROR: oci_k8s/overlays/${ADAPTATION} not found"
          exit 1
        fi
        
        cp -r oci_k8s/overlays/${ADAPTATION} oci_k8s/overlays/${ADAPTATION}-temp
        sed -i "s/IMAGE_TAG/\"${IMAGE_TAG}\"/g" oci_k8s/overlays/${ADAPTATION}-temp/kustomization.yaml
        
        kubectl kustomize oci_k8s/overlays/${ADAPTATION}-temp/ > k8s-manifest-${ADAPTATION}.yaml
        echo "Generated k8s-manifest-${ADAPTATION}.yaml"
        
        rm -rf oci_k8s/overlays/${ADAPTATION}-temp
      done

# Output artifacts: 1 container image + N K8s manifests (one per adaptation overlay)
outputArtifacts:
  - name: api_adap_image_name
    type: DOCKER_IMAGE
    location: ${REPOSITORY_URI}:${IMAGE_TAG}
  - name: api_demo_manifest_deployment_name
    type: BINARY
    location: k8s-manifest-demo.yaml
  - name: api_datanett_manifest_deployment_name
    type: BINARY
    location: k8s-manifest-datanett.yaml
  - name: api_guinea_manifest_deployment_name
    type: BINARY
    location: k8s-manifest-guinea.yaml
  - name: api_sisomali_manifest_deployment_name
    type: BINARY
    location: k8s-manifest-sisomali.yaml
