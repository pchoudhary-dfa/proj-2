apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfa-v6-api
  namespace: apps-dfa-v6-demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dfa-v6-api
  template:
    metadata:
      labels:
        app: dfa-v6-api
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: dfa-v6-api
        image: dfa-v6-api
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "1.5Gi"
            cpu: "150m"
          limits:
            memory: "2Gi"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
