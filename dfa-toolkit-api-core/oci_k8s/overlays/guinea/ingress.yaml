apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dfa-v6-api-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Allow large URI query strings (many filter IDs) — prevents 414 Request-URI Too Large.
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 32k"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - visualizerapi.guinea.dataforall.org
    secretName: guinea-dfa-v6-api-tls
  rules:
  - host: visualizerapi.guinea.dataforall.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dfa-v6-api-service
            port:
              number: 80
